[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectree-kgqa"
version = "0.1.0"
description = "SpecTree: incremental shared hypothesis compilation and overlap-aware budget reinvestment for KGQA"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["knowledge graph question answering", "graph reasoning", "budget scheduling", "LLM"]
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.1", "transformers>=4.49", "peft>=0.13", "accelerate>=1.0", "safetensors>=0.4"]
analysis = ["numpy>=1.24", "matplotlib>=3.7"]
test = ["pytest>=8.0", "numpy>=1.24"]
all = ["torch>=2.1", "transformers>=4.49", "peft>=0.13", "accelerate>=1.0", "numpy>=1.24", "matplotlib>=3.7", "pytest>=8.0"]

[project.scripts]
spectree-demo = "spectree.demo:main"
spectree-run = "spectree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spectree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
